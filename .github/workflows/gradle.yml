name: Build and test

on:
  push:
    branches: [master, solution]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build, test and regenerate sample reports
        run: ./gradlew --no-daemon clean build sampleReports
      - name: Verify that committed sample reports are up to date
        run: git diff --exit-code -- reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bytecode-results
          path: |
            build/reports/tests/test/
            build/distributions/*.zip
            reports/*.json
